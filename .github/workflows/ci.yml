name: ci

on: { push: {}, pull_request: {} }

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: db0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d db0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: db0
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u test -ptest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRESQL_URL: postgresql://test:test@localhost:5432/db0
      MYSQL_URL: mysql://test:test@localhost:3306/db0
    steps:
      - uses: actions/checkout@v6
      - run: npm i -g --force corepack && corepack enable
      - uses: actions/setup-node@v6
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:types
      - run: pnpm vitest
